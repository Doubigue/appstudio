name: Build APK

on:
  push:
    paths:
      - 'builds/*/config.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/config\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-pil

      - name: Préparer le projet Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          trap 'sleep 2' EXIT
          CFG="$GITHUB_WORKSPACE/$DIR/config.json"
          NAME=$(jq -r .name "$CFG");  PKG=$(jq -r .pkg "$CFG")
          VN=$(jq -r .versionName "$CFG"); VC=$(jq -r .versionCode "$CFG")
          ORI=$(jq -r .orientation "$CFG"); COLOR=$(jq -r .color "$CFG")
          FULL=$(jq -r .fullscreen "$CFG")
          [ "$ORI" = "auto" ] && ORI=unspecified

          python3 "$GITHUB_WORKSPACE/.github/scripts/android_setup.py" fetch "$CFG" "$GITHUB_WORKSPACE/$DIR"
          mkdir -p work/www
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d work/www
          if [ ! -f work/www/index.html ]; then
            SUB=$(find work/www -path '*__MACOSX*' -prune -o -name index.html -print | head -n1)
            test -n "$SUB" || { echo "index.html introuvable"; exit 1; }
            mv "$(dirname "$SUB")" work/www2
            rm -rf work/www && mv work/www2 work/www
          fi

          cd work
          npm init -y >/dev/null
          has(){ jq -e --arg k "$1" '(.permissions // []) | index($k)' "$CFG" >/dev/null; }
          PLUG="@capacitor/share@6 @capacitor/browser@6 @capacitor/clipboard@6 @capacitor/network@6 @capacitor/device@6 @capacitor/app@6 @capacitor/haptics@6 @capacitor/preferences@6"
          if has storage || has media || has allfiles; then PLUG="$PLUG @capacitor/filesystem@6"; fi
          if has camera; then PLUG="$PLUG @capacitor/camera@6"; fi
          if has location; then PLUG="$PLUG @capacitor/geolocation@6"; fi
          if has notifications; then PLUG="$PLUG @capacitor/local-notifications@6"; fi
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 $PLUG
          npx cap init "$NAME" "$PKG" --web-dir www
          jq --arg c "$COLOR" '.backgroundColor=$c' capacitor.config.json > c.tmp && mv c.tmp capacitor.config.json
          if [ "$(jq -r '.sourceKind // ""' "$CFG")" = "site" ]; then
            jq --arg u "$(jq -r .sourceUrl "$CFG")" '.server={url:$u,cleartext:true,allowNavigation:["*"]}' capacitor.config.json > c.tmp && mv c.tmp capacitor.config.json
          fi
          npx cap add android

          sed -i "s/versionCode 1/versionCode $VC/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          sed -i "s/<activity/<activity android:screenOrientation=\"$ORI\"/" android/app/src/main/AndroidManifest.xml
          if [ "$FULL" = "true" ]; then
            sed -i 's|<style name="AppTheme.NoActionBar"[^>]*>|&<item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
          fi

          if [ "$(jq -r .icon "$CFG")" = "true" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/icon_setup.py" gradle android/app/src/main/res "$GITHUB_WORKSPACE/$DIR/icon.png" "$COLOR"
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/android_setup.py" capacitor "$CFG"
          python3 "$GITHUB_WORKSPACE/.github/scripts/fonction_setup.py" android/app "$CFG" "$GITHUB_WORKSPACE/$DIR/app.zip" "$GITHUB_WORKSPACE/$DIR/icon.png"
          npx cap sync android

      - name: Clé de signature stable (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          K="$GITHUB_WORKSPACE/signing/debug.keystore"
          if [ -f "$K" ]; then
            cp "$K" ~/.android/debug.keystore
            echo "Clé de signature existante réutilisée"
          else
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p "$GITHUB_WORKSPACE/signing"; cp ~/.android/debug.keystore "$K"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f signing/debug.keystore
            git commit -qm "Clé de signature stable [skip ci]" || true
            git pull --rebase -q || true
            git push -q || true
            echo "Nouvelle clé de signature créée et enregistrée dans signing/"
          fi

      - name: Compiler l'APK
        working-directory: work/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(jq -r .name "$DIR/config.json"); VN=$(jq -r .versionName "$DIR/config.json")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=app
          cp work/android/app/build/outputs/apk/debug/app-debug.apk "$SLUG-$VN.apk"
          CF="$DIR/config.json"
          CFGJ=$(jq -c 'del(.fromRelease,.replaces,.iconFrom)' "$CF")
          NOTES=$(printf 'Version : %s (%s)\nPaquet : %s\nType : web\nConfig : %s' "$VN" "$(jq -r .versionCode "$CF")" "$(jq -r .pkg "$CF")" "$CFGJ")
          FILES=("$SLUG-$VN.apk")
          if [ -f "$DIR/app.zip" ] && [ "$(jq -r '.sourceKind // ""' "$CF")" != "site" ]; then cp "$DIR/app.zip" source.zip; FILES+=(source.zip); fi
          if [ -f "$DIR/icon.png" ]; then FILES+=("$DIR/icon.png"); fi
          gh release create "apk-$ID" "${FILES[@]}" --title "$NAME" --notes "$NOTES"
          OLD=$(jq -r '.replaces // ""' "$CF")
          if [ -n "$OLD" ]; then gh release delete "$OLD" --cleanup-tag -y || true; fi

      - name: Nettoyer la demande
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          [ -n "$DIR" ] || exit 0
          LOG="$GITHUB_WORKSPACE/build.log"
          OUT="$GITHUB_WORKSPACE/$DIR/build-error.txt"
          mkdir -p "$GITHUB_WORKSPACE/$DIR"
          {
            echo "== Journal de compilation ($ID) =="
            if [ -f "$LOG" ]; then
              sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$LOG" | tr -d '\r' | grep -v -E '^ *\[[= >]*\] +[0-9]+%' | tail -n 400 | cut -c1-4000
            else
              echo "Aucun journal disponible (échec avant la compilation)."
            fi
          } > "$OUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal d'erreur $ID [skip ci]" || exit 0
          git pull --rebase -q || true
          git push -q || true
