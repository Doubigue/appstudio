name: Build Flutter APK

on:
  push:
    paths:
      - 'builds/*/flutter.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/flutter\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-pil

      - name: Préparer le projet Flutter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          trap 'sleep 2' EXIT
          CFG="$GITHUB_WORKSPACE/$DIR/flutter.json"
          export NAME=$(jq -r .name "$CFG") PKG=$(jq -r .pkg "$CFG") ORI=$(jq -r .orientation "$CFG") FULL=$(jq -r .fullscreen "$CFG")
          VN=$(jq -r .versionName "$CFG"); VC=$(jq -r .versionCode "$CFG")
          [ "$ORI" = "auto" ] && ORI=unspecified

          python3 "$GITHUB_WORKSPACE/.github/scripts/android_setup.py" fetch "$CFG" "$GITHUB_WORKSPACE/$DIR" flutter
          SRC=work/src; mkdir -p "$SRC"
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d "$SRC"
          first(){ find "$SRC" -path '*__MACOSX*' -prune -o -name "$1" -print | awk -F/ '{print NF" "$0}' | sort -n | head -n1 | cut -d' ' -f2-; }
          PS=$(first pubspec.yaml)

          flutter create --platforms android --project-name apk_app work/app
          rm -rf work/app/test
          if [ -n "$PS" ]; then
            rsync -a --exclude /android --exclude /ios --exclude /web --exclude /linux --exclude /macos --exclude /windows --exclude /build --exclude /.dart_tool --exclude /test "$(dirname "$PS")"/ work/app/
          else
            MD=$(first main.dart)
            test -n "$MD" || { echo "Aucun pubspec.yaml ni main.dart dans le ZIP"; exit 1; }
            rm -rf work/app/lib && mkdir work/app/lib
            cp -r "$(dirname "$MD")"/. work/app/lib/
          fi

          cd work/app
          if grep -q '^version:' pubspec.yaml; then
            sed -i -E "s/^version:.*/version: $VN+$VC/" pubspec.yaml
          else
            echo "version: $VN+$VC" >> pubspec.yaml
          fi

          python3 - <<'PY'
          import os,re,glob,html
          pkg=os.environ['PKG'];name=html.escape(os.environ['NAME'],quote=True)
          ori=os.environ['ORI'];full=os.environ['FULL']=='true'
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          s=re.sub(r'android:label="[^"]*"',lambda _:'android:label="%s"'%name,s,count=1)
          s=s.replace('<activity','<activity android:screenOrientation="%s"'%ori,1)
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          open(m,'w').write(s)
          for f in glob.glob('android/app/build.gradle*'):
              t=open(f).read()
              t=re.sub(r'applicationId(\s*=?\s*)"[^"]*"',lambda x:'applicationId%s"%s"'%(x.group(1),pkg),t)
              open(f,'w').write(t)
          if full:
              for f in glob.glob('android/app/src/main/res/values*/styles.xml'):
                  t=open(f).read()
                  t=re.sub(r'(<style name="(?:Launch|Normal)Theme"[^>]*>)',r'\1<item name="android:windowFullscreen">true</item>',t)
                  open(f,'w').write(t)
          PY

          python3 "$GITHUB_WORKSPACE/.github/scripts/android_setup.py" flutter "$CFG"

          if [ "$(jq -r .icon "$CFG")" = "true" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/icon_setup.py" gradle android/app/src/main/res "$GITHUB_WORKSPACE/$DIR/icon.png" "$(jq -r .color "$CFG")"
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/fonction_setup.py" android/app "$CFG" "$GITHUB_WORKSPACE/$DIR/app.zip" "$GITHUB_WORKSPACE/$DIR/icon.png"

      - name: Clé de signature stable (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          K="$GITHUB_WORKSPACE/signing/debug.keystore"
          if [ -f "$K" ]; then
            cp "$K" ~/.android/debug.keystore
            echo "Clé de signature existante réutilisée"
          else
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p "$GITHUB_WORKSPACE/signing"; cp ~/.android/debug.keystore "$K"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f signing/debug.keystore
            git commit -qm "Clé de signature stable [skip ci]" || true
            git pull --rebase -q || true
            git push -q || true
            echo "Nouvelle clé de signature créée et enregistrée dans signing/"
          fi

      - name: Compiler l'APK
        working-directory: work/app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          flutter build apk --release --no-shrink 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" || {
            # Échec : ajoute au journal le détail des erreurs de fusion du manifeste
            for R in $(find . -name 'manifest-merger-*-report.txt' 2>/dev/null); do
              { echo "== RAPPORT FUSION MANIFESTE ($R) =="; grep -n -i -B1 -A4 -E 'error|conflict|cannot be smaller' "$R" | head -n 80; } 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
            done
            exit 1
          }

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(jq -r .name "$DIR/flutter.json"); VN=$(jq -r .versionName "$DIR/flutter.json")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=app
          cp work/app/build/app/outputs/flutter-apk/app-release.apk "$SLUG-$VN.apk"
          CF="$DIR/flutter.json"
          CFGJ=$(jq -c 'del(.fromRelease,.replaces,.iconFrom)' "$CF")
          NOTES=$(printf 'Version : %s (%s)\nPaquet : %s\nType : flutter\nConfig : %s' "$VN" "$(jq -r .versionCode "$CF")" "$(jq -r .pkg "$CF")" "$CFGJ")
          FILES=("$SLUG-$VN.apk")
          if [ -f "$DIR/app.zip" ] && [ "$(jq -r '.sourceKind // ""' "$CF")" != "site" ]; then cp "$DIR/app.zip" source.zip; FILES+=(source.zip); fi
          if [ -f "$DIR/icon.png" ]; then FILES+=("$DIR/icon.png"); fi
          gh release create "apk-$ID" "${FILES[@]}" --title "$NAME" --notes "$NOTES"
          OLD=$(jq -r '.replaces // ""' "$CF")
          if [ -n "$OLD" ]; then gh release delete "$OLD" --cleanup-tag -y || true; fi

      - name: Nettoyer la demande
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          [ -n "$DIR" ] || exit 0
          LOG="$GITHUB_WORKSPACE/build.log"
          OUT="$GITHUB_WORKSPACE/$DIR/build-error.txt"
          mkdir -p "$GITHUB_WORKSPACE/$DIR"
          {
            echo "== Journal de compilation ($ID) =="
            if [ -f "$LOG" ]; then
              sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$LOG" | tr -d '\r' | grep -v -E '^ *\[[= >]*\] +[0-9]+%' | tail -n 400 | cut -c1-4000
            else
              echo "Aucun journal disponible (échec avant la compilation)."
            fi
          } > "$OUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal d'erreur $ID [skip ci]" || exit 0
          git pull --rebase -q || true
          git push -q || true
