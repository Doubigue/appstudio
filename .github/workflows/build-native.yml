name: Build Android natif APK

on:
  push:
    paths:
      - 'builds/*/native.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Détecter la demande
        run: |
          CFG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^builds/[^/]+/native\.json$' | head -n1)
          test -n "$CFG"
          echo "DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "ID=$(basename "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-pil

      - name: Préparer le projet Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          trap 'sleep 2' EXIT
          CFG="$GITHUB_WORKSPACE/$DIR/native.json"
          S="$GITHUB_WORKSPACE/.github/scripts"

          python3 "$S/android_setup.py" fetch "$CFG" "$GITHUB_WORKSPACE/$DIR" native
          mkdir -p "$GITHUB_WORKSPACE/work/src"
          unzip -q "$GITHUB_WORKSPACE/$DIR/app.zip" -d "$GITHUB_WORKSPACE/work/src"
          SET=$(python3 "$S/native_setup.py" find "$GITHUB_WORKSPACE/work/src" settings.gradle settings.gradle.kts || true)
          test -n "$SET" || { echo "Aucun settings.gradle(.kts) dans le ZIP : envoie un projet Android Studio complet."; exit 1; }
          ROOT=$(dirname "$SET")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          python3 "$S/native_setup.py" gradle "$CFG" "$ROOT" | tee "$GITHUB_WORKSPACE/work/gradle.out"
          MOD=$(sed -n 's/^MODULE=//p' "$GITHUB_WORKSPACE/work/gradle.out" | head -n1)

          if [ "$(jq -r .icon "$CFG")" = "true" ]; then
            python3 "$S/icon_setup.py" gradle "$MOD/src/main/res" "$GITHUB_WORKSPACE/$DIR/icon.png" "$(jq -r .color "$CFG")"
          fi
          python3 "$S/fonction_setup.py" "$MOD" "$CFG" "$GITHUB_WORKSPACE/$DIR/app.zip" "$GITHUB_WORKSPACE/$DIR/icon.png"

      - name: Clé de signature stable (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          K="$GITHUB_WORKSPACE/signing/debug.keystore"
          if [ -f "$K" ]; then
            cp "$K" ~/.android/debug.keystore
            echo "Clé de signature existante réutilisée"
          else
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p "$GITHUB_WORKSPACE/signing"; cp ~/.android/debug.keystore "$K"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -f signing/debug.keystore
            git commit -qm "Clé de signature stable [skip ci]" || true
            git pull --rebase -q || true
            git push -q || true
            echo "Nouvelle clé de signature créée et enregistrée dans signing/"
          fi

      - name: Compiler l'APK
        run: |
          set -o pipefail
          cd "$ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          else
            gradle assembleDebug --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          fi
          APK=$(find "$ROOT" -path '*outputs/apk/debug/*.apk' ! -name '*androidTest*' | head -n1)
          test -n "$APK" || { echo "Aucun APK debug produit."; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CF="$DIR/native.json"
          NAME=$(jq -r .name "$CF"); VN=$(jq -r .versionName "$CF")
          SLUG=$(echo "$NAME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/^-//;s/-$//')
          [ -n "$SLUG" ] || SLUG=app
          test -f "$APK" || { echo "APK introuvable : $APK"; exit 1; }
          cp "$APK" "$SLUG-$VN.apk"
          CFGJ=$(jq -c 'del(.fromRelease,.replaces,.iconFrom)' "$CF")
          NOTES=$(printf 'Version : %s (%s)\nPaquet : %s\nType : native\nConfig : %s' "$VN" "$(jq -r .versionCode "$CF")" "$(jq -r .pkg "$CF")" "$CFGJ")
          FILES=("$SLUG-$VN.apk")
          if [ -f "$DIR/app.zip" ] && [ "$(jq -r '.sourceKind // ""' "$CF")" != "site" ]; then cp "$DIR/app.zip" source.zip; FILES+=(source.zip); fi
          if [ -f "$DIR/icon.png" ]; then FILES+=("$DIR/icon.png"); fi
          gh release create "apk-$ID" "${FILES[@]}" --title "$NAME" --notes "$NOTES"
          OLD=$(jq -r '.replaces // ""' "$CF")
          if [ -n "$OLD" ]; then gh release delete "$OLD" --cleanup-tag -y || true; fi

      - name: Nettoyer la demande
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -rq "$DIR"
          git commit -qm "Nettoyage $ID [skip ci]"
          git pull --rebase -q || true
          git push -q || true

      - name: Enregistrer le journal d'erreur
        if: failure()
        run: |
          [ -n "$DIR" ] || exit 0
          LOG="$GITHUB_WORKSPACE/build.log"
          OUT="$GITHUB_WORKSPACE/$DIR/build-error.txt"
          mkdir -p "$GITHUB_WORKSPACE/$DIR"
          {
            echo "== Journal de compilation ($ID) =="
            if [ -f "$LOG" ]; then
              sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$LOG" | tr -d '\r' | grep -v -E '^ *\[[= >]*\] +[0-9]+%' | tail -n 400 | cut -c1-4000
            else
              echo "Aucun journal disponible (échec avant la compilation)."
            fi
          } > "$OUT"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f "$DIR/build-error.txt"
          git commit -qm "Journal d'erreur $ID [skip ci]" || exit 0
          git pull --rebase -q || true
          git push -q || true
