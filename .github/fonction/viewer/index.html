<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fonction</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#FAF6F3;--card:#fff;--ink:#141A22;--mut:#6B7280;--line:#ECE6E1;--chip:#F0EDEA;--acc:#FF3F1A;--th:11;--tint:hsl(var(--th) 100% 94%);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10141B;--card:#1A2029;--ink:#EEF1F5;--mut:#9AA3B0;--line:#2A323E;--chip:#232B37;--tint:hsl(var(--th) 45% 17%)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#back{border:0;background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:20px;line-height:1;cursor:pointer;flex:none}
#logo{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip);display:none}
.hi{min-width:0;flex:1}
.hi b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi small{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:12px;padding:9px 6px;background:transparent;color:var(--mut);font:600 13px system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--tint);color:var(--acc)}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 28px;display:none;-webkit-overflow-scrolling:touch}
section.on{display:block}
#sDesc{padding:0 0 28px}
#sAnim{padding:0;overflow:hidden}
#sAnim.on{display:flex;flex-direction:column}
#frame{flex:1;width:100%;border:0;background:#fff}
.md h1{font-size:22px;margin:.2em 0 .5em}.md h2{font-size:18px;margin:1.3em 0 .4em}.md h3{font-size:15.5px;margin:1.1em 0 .3em}
.md p{margin:.6em 0}.md ul,.md ol{padding-left:22px;margin:.5em 0}.md li{margin:.25em 0}
.md code{background:var(--chip);padding:1px 6px;border-radius:6px;font:13px ui-monospace,Menlo,monospace}
.md pre{background:var(--chip);padding:12px;border-radius:12px;overflow-x:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:.2em 12px;border-left:3px solid var(--acc);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md a{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grid img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--chip)}
.grid figcaption{padding:6px 10px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mut);padding:56px 20px}.empty big{display:block;font-size:34px;margin-bottom:8px}
#lb{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px}
#lbX{top:14px;right:14px}#lbP{left:10px;top:50%}#lbN{right:10px;top:50%}
#lbC{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:13px}

/* ===== Description animée ===== */
.wrap{padding:6px 16px 0}
.hero{position:relative;overflow:hidden;color:#fff;padding:24px 18px 50px;display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(0,0,0,.28)),var(--acc)}
.hl{flex:1;min-width:0;position:relative;z-index:2}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 70%);animation:float 9s ease-in-out infinite}
.b1{width:190px;height:190px;left:-60px;top:-70px}.b2{width:120px;height:120px;right:32%;bottom:0;animation-delay:-3s;opacity:.6}.b3{width:90px;height:90px;right:-20px;top:20px;animation-delay:-6s}
.sp{position:absolute;width:14px;height:14px;z-index:1;animation:twinkle 2.6s ease-in-out infinite}
.sp.s1{left:48%;top:16px}.sp.s2{right:22px;bottom:70px;animation-delay:-1.2s;width:10px;height:10px}.sp.s3{left:16px;bottom:58px;animation-delay:-.6s;width:9px;height:9px}
.aic{width:60px;height:60px;border-radius:18px;background:#ffffff2e;display:grid;place-items:center;position:relative;margin-bottom:12px;animation:up .7s both}
.aic:after{content:"";position:absolute;inset:-4px;border-radius:22px;border:2px solid #ffffff80;animation:ring 2.4s ease-out infinite}
.aic img{width:100%;height:100%;border-radius:18px;object-fit:cover;display:block}
.aic svg{width:30px;height:30px}
.ver{display:inline-block;background:#00000038;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.03em;animation:up .7s .1s both}
.hero h1{margin:6px 0 4px;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.01em;animation:up .7s .18s both;overflow-wrap:anywhere}
.hero .tag p{margin:.3em 0 0;font-size:14.5px;opacity:.94;animation:up .7s .28s both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;animation:up .7s .4s both}
.chip{background:#ffffff2e;border:1px solid #ffffff4d;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.chip b{font-size:15px;margin-right:3px}
.pho{width:84px;flex:none;position:relative;z-index:2;animation:float 5s ease-in-out infinite}
.pho .d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .2s ease forwards}
.pho .bar{animation:shim 2.4s ease-in-out infinite}.pho .bar:nth-of-type(2){animation-delay:.4s}.pho .bar:nth-of-type(3){animation-delay:.8s}
.pho .rip{transform-box:fill-box;transform-origin:center;animation:rip 2s ease-out infinite}
.wave{position:absolute;left:0;bottom:-1px;width:200%;height:26px;z-index:3;animation:wv 7s linear infinite}
.rv{opacity:0;transform:translateY(22px) scale(.98);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.sh{display:flex;align-items:center;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
.badge{width:40px;height:40px;border-radius:13px;color:#fff;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(0,0,0,.2)),var(--acc);box-shadow:0 6px 16px -6px var(--acc)}
.badge .ic{width:22px;height:22px}
.sh h2{margin:0;font-size:20px}
.sh .ul{display:block;flex-basis:100%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc),transparent);transform:scaleX(0);transform-origin:left;transition:transform .9s .25s ease}
.sh.in .ul{transform:scaleX(1)}
.cards{display:grid;gap:12px}
.card{--c:hsl(var(--h) 80% 50%);--t:hsl(var(--h) 100% 95%);display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 18px;position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.card,.st{--t:hsl(var(--h) 40% 20%)}}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card.in:active{transform:scale(.97)}
.tile{width:46px;height:46px;border-radius:14px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none}
.card.in .tile{animation:bob 3.4s ease-in-out infinite var(--d)}
.tile .ic{width:26px;height:26px}.emo{font-size:24px;line-height:1}
.ct{min-width:0}.ct h3{margin:0 0 2px;font-size:15.5px}.ct p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.tl{list-style:none;margin:0;padding:0}
.st{--c:hsl(var(--h) 80% 50%);--t:hsl(var(--h) 100% 92%);display:flex;gap:14px;align-items:center;position:relative;padding-bottom:14px}
.st:not(:last-child):after{content:"";position:absolute;left:19px;top:42px;bottom:-2px;width:2px;background:linear-gradient(var(--c),transparent);transform-origin:top;transform:scaleY(0);transition:transform .7s .3s ease}
.st.in:after{transform:scaleY(1)}
.num{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;position:relative;z-index:1}
.st.in .num{animation:pulse 2.4s infinite var(--d)}
.sb2{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.sb2 span{flex:1}.sb2 .ic{width:22px;height:22px;color:var(--c);flex:none}
.tip{display:flex;gap:12px;align-items:center;margin:10px 0;padding:14px;border-radius:18px;background:var(--tint);border:1px dashed var(--acc)}
.bulb{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.bulb .ic{width:22px;height:22px}
.tip.in .bulb{animation:glow 2.2s ease-in-out infinite}
.prose{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin:10px 0}
.rv .ic *{stroke-dasharray:1;stroke-dashoffset:1}
.rv.in .ic *{animation:draw 1s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes shim{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes wv{to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 hsl(var(--h) 85% 52%/.5)}70%{box-shadow:0 0 0 12px hsl(var(--h) 85% 52%/0)}100%{box-shadow:0 0 0 0 hsl(var(--h) 85% 52%/0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--acc)}50%{box-shadow:0 0 18px 4px var(--acc)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.rv .ic *,.pho .d{stroke-dashoffset:0}.sh .ul{transform:none}}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Retour">‹</button>
  <img id="logo" alt="">
  <div class="hi"><b id="appName">Application</b><small id="appVer"></small></div>
</header>
<nav id="tabs">
  <button data-s="sDesc" class="on">Description</button>
  <button data-s="sCaps" id="tCaps">Captures</button>
  <button data-s="sAnim">Animation</button>
</nav>
<main>
  <section id="sDesc" class="on"><div id="md"></div></section>
  <section id="sCaps"><div id="grid" class="grid"></div></section>
  <section id="sAnim"><iframe id="frame" title="Animation"></iframe></section>
</main>
<div id="lb"><button id="lbX" aria-label="Fermer">✕</button><button id="lbP" aria-label="Précédente">‹</button><button id="lbN" aria-label="Suivante">›</button><img id="lbI" alt=""><div id="lbC"></div></div>

<script>
/* Données écrites à la compilation par .github/scripts/fonction_setup.py (démo si ouvert seul dans un navigateur) */
const DATA=/*__DATA_START__*/{"name":"Mon application","version":"1.0.0","icon":null,"description":"# Mon application\n\nExemple de description.\n\n## Fonctions\n\n- Créer un élément\n- **Modifier** et supprimer\n- Partager",
"captures":[],"animation":null}/*__DATA_END__*/;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---- Markdown minimal (titres, listes, gras/italique, code, citations, liens, séparateurs) ---- */
function inline(t){
  t=esc(t);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function md(src){
  const L=String(src||'').replace(/\r\n?/g,'\n').split('\n');let o='',i=0,list=null,para=[];
  const flushP=()=>{if(para.length){o+='<p>'+inline(para.join(' '))+'</p>';para=[]}};
  const closeL=()=>{if(list){o+='</'+list+'>';list=null}};
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){flushP();closeL();let c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;o+='<pre><code>'+esc(c.join('\n'))+'</code></pre>';continue}
    let m;
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){flushP();closeL();o+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';i++;continue}
    if(/^\s*([-*_])\1\1+\s*$/.test(l)){flushP();closeL();o+='<hr>';i++;continue}
    if((m=l.match(/^\s*[-*+]\s+(.*)$/))){flushP();if(list!=='ul'){closeL();o+='<ul>';list='ul'}o+='<li>'+inline(m[1])+'</li>';i++;continue}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(list!=='ol'){closeL();o+='<ol>';list='ol'}o+='<li>'+inline(m[1])+'</li>';i++;continue}
    if((m=l.match(/^>\s?(.*)$/))){flushP();closeL();o+='<blockquote>'+inline(m[1])+'</blockquote>';i++;continue}
    if(!l.trim()){flushP();closeL();i++;continue}
    closeL();para.push(l.trim());i++;
  }
  flushP();closeL();return o;
}

/* ---- En-tête ---- */
$('appName').textContent=DATA.name||'Application';
$('appVer').textContent=DATA.version?'Version '+DATA.version:'';
if(DATA.icon){const g=$('logo');g.src=DATA.icon;g.style.display='block'}
document.title='Fonction · '+(DATA.name||'');


/* ---- Description animée : hero, cartes à icônes dessinées, timeline, astuces ---- */
const IC={
download:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
share:'<circle cx="6" cy="12" r="2.5"/><circle cx="17" cy="6" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M8.2 10.8l6.6-3.6M8.2 13.2l6.6 3.6"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18H7z"/>',
bell:'<path d="M6 16v-5a6 6 0 0112 0v5l2 2H4l2-2z"/><path d="M10 21h4"/>',
camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
chart:'<path d="M5 20v-9M12 20V4M19 20v-6"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/>',
check:'<path d="M5 12l5 5 9-10"/>',
torrent:'<path d="M6 3v8a6 6 0 0012 0V3h-4v8a2 2 0 01-4 0V3H6z"/>',
play:'<path d="M8 5v14l11-7z"/>',
spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>'
};
for(const k in IC)IC[k]=IC[k].replace(/<(path|circle|rect) /g,'<$1 pathLength="1" ');
const svg=k=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[k]||IC.spark)+'</svg>';
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const KEYS=[[/torrent|magnet/,'torrent'],[/video|film|serie|stream|lecteur/,'video'],[/musi|audio|platine|chanson|playlist|\bmix/,'music'],[/micro|vocal|voix|dict/,'mic'],
[/telecharg|download/,'download'],[/cloud|sync|sauvegard|backup/,'cloud'],[/dossier|fichier|rang|organis|classe|stockage/,'folder'],[/recher|scan|analys|detect|trouv|filtr/,'search'],[/param|reglage|option|config|theme|personnalis/,'settings'],
[/partag|envoi|envoy|export|diffus/,'share'],[/photo|camera|capture|selfie/,'camera'],[/image|galerie|album/,'image'],
[/navig|\bweb|site|lien|url|internet|page|en ligne/,'globe'],[/securi|verrou|mot de passe|prive|protege|pin|chiffr/,'lock'],[/notif|alerte|rappel|alarme/,'bell'],
[/stat|graph|suivi|progress|vitesse|score|bilan/,'chart'],[/heure|temps|planif|minuteur|horloge|chrono|agenda/,'clock'],[/code|script|program|developp/,'code'],
[/compte|profil|utilisateur|contact|\bami/,'user'],[/modif|edit|ecri|redig|note/,'edit'],[/ajout|creer|cree|nouveau|nouvelle/,'plus'],[/liste|tache|todo|a faire/,'list'],[/valid|termin|fini|coch/,'check']];
const pick=(t,d)=>{t=norm(t);for(const[r,k]of KEYS)if(r.test(t))return k;return d};
const secIcon=t=>{t=norm(t);return/fonction|caracter|atout|point/.test(t)?'spark':/utilis|comment|etape|demarr|mode d/.test(t)?'play':/astuce|conseil|bon a savoir|remarque|note/.test(t)?'bulb':pick(t,'star')};
let EM;try{EM=new RegExp('^(\\p{Extended_Pictographic}[\\uFE0F\\u200D\\p{Extended_Pictographic}]*)\\s*','u')}catch(e){EM=/^$^/}
function hueOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(!d)return 11;let h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}
if(/^#[0-9a-f]{6}$/i.test(DATA.color||'')){document.documentElement.style.setProperty('--acc',DATA.color);document.documentElement.style.setProperty('--th',hueOf(DATA.color))}
const BASE=/^#[0-9a-f]{6}$/i.test(DATA.color||'')?hueOf(DATA.color):11;
const HUES=[0,160,205,55,275,325].map(d=>(BASE+d)%360);
let hc=0;const stat={f:0,s:0};
function parseItem(t){let m=t.match(/^\*\*(.+?)\*\*\s*[:：–—-]*\s*(.*)$/);if(m)return[m[1],m[2]];m=t.match(/^([^:]{2,40}):\s+(.+)$/);if(m)return[m[1],m[2]];return[t,'']}
function cards(items){
  return '<div class="cards">'+items.map((t,i)=>{
    const e=t.match(EM);let ico;if(e){t=t.slice(e[0].length);ico='<span class="emo">'+e[1]+'</span>'}
    const[ti,de]=parseItem(t);if(!e)ico=svg(pick(ti,pick(de,'spark')));
    return '<article class="card rv" style="--h:'+HUES[hc++%HUES.length]+';--d:'+Math.min(i,8)*70+'ms"><div class="tile">'+ico+'</div><div class="ct"><h3>'+inline(ti)+'</h3>'+(de?'<p>'+inline(de)+'</p>':'')+'</div></article>'}).join('')+'</div>';
}
function steps(items){
  return '<ol class="tl">'+items.map((t,i)=>{
    const k=pick(t,'');
    return '<li class="st rv" style="--h:'+HUES[hc++%HUES.length]+';--d:'+Math.min(i,8)*80+'ms"><span class="num">'+(i+1)+'</span><div class="sb2"><span>'+inline(t)+'</span>'+(k?svg(k):'')+'</div></li>'}).join('')+'</ol>';
}
const tip=t=>'<div class="tip rv"><div class="bulb">'+svg('bulb')+'</div><div>'+inline(t)+'</div></div>';
function head(title){
  const e=title.match(EM);let ico;
  if(e){title=title.slice(e[0].length);ico='<span class="emo">'+e[1]+'</span>'}else ico=svg(secIcon(title));
  return '<div class="sh rv"><div class="badge">'+ico+'</div><h2>'+inline(title)+'</h2><i class="ul"></i></div>';
}
function chunks(L){
  let o='',i=0,buf=[];
  const flush=()=>{if(buf.join('').trim())o+='<div class="prose rv md">'+md(buf.join('\n'))+'</div>';buf=[]};
  const UL=/^\s*[-*+]\s+/,OL=/^\s*\d+[.)]\s+/;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){buf.push(l);i++;while(i<L.length&&!/^```/.test(L[i]))buf.push(L[i++]);if(i<L.length)buf.push(L[i++]);continue}
    if(UL.test(l)){flush();const it=[];while(i<L.length&&UL.test(L[i]))it.push(L[i++].replace(UL,'').trim());stat.f+=it.length;o+=cards(it);continue}
    if(OL.test(l)){flush();const it=[];while(i<L.length&&OL.test(L[i]))it.push(L[i++].replace(OL,'').trim());stat.s+=it.length;o+=steps(it);continue}
    if(/^>/.test(l)){flush();while(i<L.length&&/^>/.test(L[i])){const t=L[i++].replace(/^>\s?/,'').trim();if(t)o+=tip(t)}continue}
    buf.push(l);i++;
  }
  flush();return o;
}
function phone(){
  return '<svg class="pho" viewBox="0 0 90 170" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">'
   +'<rect class="d" pathLength="1" x="8" y="6" width="74" height="158" rx="14"/><path class="d" pathLength="1" d="M34 16h22"/>'
   +'<rect class="bar" x="18" y="30" width="54" height="28" rx="8" fill="#fff" fill-opacity=".35" stroke="none"/>'
   +'<rect class="bar" x="18" y="66" width="54" height="16" rx="6" fill="#fff" fill-opacity=".35" stroke="none"/>'
   +'<rect class="bar" x="18" y="90" width="36" height="16" rx="6" fill="#fff" fill-opacity=".35" stroke="none"/>'
   +'<circle cx="58" cy="132" r="8" fill="#fff" stroke="none"/><circle class="rip" cx="58" cy="132" r="8"/></svg>';
}
function renderDesc(){
  const src=String(DATA.description||'').replace(/\r\n?/g,'\n').trim();
  let title=DATA.name||'Application',tag=[],secs=[],cur=null,h1=false,code=false;
  for(const l of src?src.split('\n'):[]){
    if(/^```/.test(l)){code=!code;(cur?cur.l:tag).push(l);continue}
    let m;
    if(!code&&!h1&&!secs.length&&(m=l.match(/^#(?!#)\s+(.*)$/))){title=m[1].trim()||title;h1=true;continue}
    if(!code&&(m=l.match(/^##(?!#)\s+(.*)$/))){cur={t:m[1].trim(),l:[]};secs.push(cur);continue}
    (cur?cur.l:tag).push(l);
  }
  let body='';
  for(const sc of secs){
    if(/capture/.test(norm(sc.t)))continue; /* l'onglet Captures s'en charge */
    body+=head(sc.t)+chunks(sc.l);
  }
  const tagHtml=tag.join('').trim()?md(tag.join('\n')):'';
  const nc=(DATA.captures||[]).length;
  const chips=[[stat.f,'fonction'],[stat.s,'étape'],[nc,'capture']].filter(c=>c[0]>0)
    .map(c=>'<span class="chip"><b data-n="'+c[0]+'">'+c[0]+'</b>'+c[1]+(c[0]>1?'s':'')+'</span>').join('');
  const logo=DATA.icon?'<img src="'+esc(DATA.icon)+'" alt="">':svg('spark').replace('class="ic"','class="ic" style="color:#fff"');
  const star='<svg class="sp s#" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="#fff"/></svg>';
  $('md').innerHTML='<div class="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>'
    +star.replace('#','1')+star.replace('#','2')+star.replace('#','3')
    +'<div class="hl"><div class="aic">'+logo+'</div>'+(DATA.version?'<span class="ver">Version '+esc(DATA.version)+'</span>':'')
    +'<h1>'+inline(title)+'</h1><div class="tag">'+tagHtml+'</div>'+(chips?'<div class="chips">'+chips+'</div>':'')+'</div>'+phone()
    +'<svg class="wave" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14Q50 0 100 14T200 14T300 14T400 14V30H0Z" fill="var(--bg)"/></svg></div>'
    +'<div class="wrap">'+(body||'<div class="empty"><big>📝</big>Aucune description fournie pour cette application.</div>')+'</div>';
  document.querySelectorAll('.chip b').forEach(b=>{const n=+b.dataset.n;let t0=null;const f=ts=>{t0=t0||ts;const p=Math.min(1,(ts-t0)/900);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};b.textContent='0';requestAnimationFrame(f)});
  const els=document.querySelectorAll('#md .rv');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:$('sDesc'),threshold:.12});
  els.forEach(e=>io.observe(e));
}

/* ---- Description ---- */
renderDesc();

/* ---- Captures + visionneuse ---- */
const caps=DATA.captures||[];let cur=0;
$('tCaps').textContent='Captures'+(caps.length?' ('+caps.length+')':'');
$('grid').innerHTML=caps.length?caps.map((c,k)=>'<figure data-k="'+k+'"><img loading="lazy" src="'+esc(c.src)+'" alt="'+esc(c.name)+'"><figcaption>'+esc(c.name)+'</figcaption></figure>').join(''):'';
if(!caps.length){$('grid').outerHTML='<div class="empty"><big>🖼️</big>Aucune capture d’écran.<br><small>Ajoute des images dans le dossier Captures du projet.</small></div>'}
function show(k){cur=(k+caps.length)%caps.length;$('lbI').src=caps[cur].src;$('lbC').textContent=(cur+1)+' / '+caps.length+' · '+caps[cur].name;$('lb').classList.add('on')}
document.addEventListener('click',e=>{const f=e.target.closest('figure[data-k]');if(f)show(+f.dataset.k)});
$('lbX').onclick=()=>$('lb').classList.remove('on');
$('lbP').onclick=()=>show(cur-1);$('lbN').onclick=()=>show(cur+1);
let x0=null;$('lb').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('lb').addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});

/* ---- Animation (chargée à la première ouverture de l'onglet) ---- */
let animOk=false;
function loadAnim(){
  if(animOk)return;animOk=true;
  if(DATA.animation)$('frame').src=DATA.animation;
  else $('sAnim').innerHTML='<div class="empty"><big>🎬</big>Aucune animation.<br><small>Ajoute un fichier .html dans le dossier Animation du projet.</small></div>';
}

/* ---- Onglets ---- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.s));
  if(b.dataset.s==='sAnim')loadAnim();
});
const hash=(location.hash||'').replace('#','');
if(hash==='captures')$('tCaps').click();else if(hash==='animation')document.querySelector('[data-s=sAnim]').click();

/* ---- Retour : ferme la visionneuse, sinon l'écran ---- */
window.__back=()=>{if($('lb').classList.contains('on')){$('lb').classList.remove('on');return true}return false};
$('back').onclick=()=>{if(window.__back())return;if(window.Fonction&&Fonction.close)Fonction.close();else history.back()};
</script>
</body>
